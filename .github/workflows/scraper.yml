name: Actualizar datos de Binance

on:
  schedule:
    # Se ejecuta automáticamente cada hora (al minuto 0)
    - cron: '0 * * * *'
  # Permite que también lo puedas encender a mano con un clic cuando quieras probar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar el scraper de Binance
        run: |
          python binance/scraper.py

      - name: Guardar los archivos CSV en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add binance/*.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "[ci] update binance" && git push)
