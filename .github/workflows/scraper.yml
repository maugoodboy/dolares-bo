name: Actualizar Binance y Oficial BCB

on:
  schedule:
    # Se ejecuta de forma automatica cada hora
    - cron: '0 * * * *'
  # Permite que lo actives a mano cuando quieras hacer pruebas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias necesarias
        run: |
          pip install requests pandas beautifulsoup4

      - name: Ejecutar scraper de Binance
        run: |
          python binance/scraper.py

      - name: Ejecutar scraper de BCB Oficial
        run: |
          python oficial/scraper.py

      - name: Guardar los archivos CSV en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add binance/*.csv oficial/*.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "[ci] update binance y oficial" && git push)
